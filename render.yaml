services:
  - type: web
    name: meeting-chatbot-api
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: POSTGRES_HOST
        value: localhost
      - key: POSTGRES_PORT
        value: 5432
      - key: POSTGRES_DB
        value: meeting_chatbot
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        value: postgres
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: Meeting Minute Chatbot

  - type: web
    name: meeting-chatbot-frontend
    runtime: python
    plan: free
    buildCommand: "pip install streamlit requests"
    startCommand: "streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0